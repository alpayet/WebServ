server {
	listen 8000;
	hostname 0.0.0.0;


 	root /home/ludebion/Work/WebServ/html/;

	index cacao.htm cacao.html;

	location / {
		root /potato/;
		index banana.html banana.htm;
		autoindex on;
	 }

 	location /app/ {
		root /home/ludebion/Work/WebServ/html/;
		index index.html;
		autoindex on;
	 }

	location /uploads/ {
		root /home/ludebion/Work/WebServ/www/uploads/;
		index index.html;
		autoindex on;
	 }

	location /508.html/ {
		root /usr/share/nginx/html/;
		limit_except GET;
	}

	error_page 404 /404.html;

	client_max_body_size 1717171;
}
