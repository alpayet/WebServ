server {
	listen 8000;
	hostname 0.0.0.0;


	root /home/alpayet/projects/WebServ/html/;
	index index.html;

	location / {
		root /home/alpayet/projects/WebServ/html/;
		index index.html;
		autoindex on;
	 }

	location /app/ {
		root /home/alpayet/projects/WebServ/html/;
		index index.html;
		autoindex on;
	 }

	location /uploads/ {
		root /home/alpayet/projects/WebServ/html/uploads/;
		index index.html;
		autoindex on;
	 }

	location /508.html/ {
		root /usr/share/nginx/html/;
		limit_except GET;
	}

	client_max_body_size 1717171;
}
